name: Build iStoreOS H6XK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "编译成功后上传到 Pre-release（预发布）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: h6xk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/workdir/istoreos/.ccache
    steps:
      - name: Checkout configuration repository
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip wget zlib1g-dev file xz-utils subversion swig time \
            libelf-dev cmake ninja-build meson pkg-config jq curl perl \
            patch libfuse-dev autopoint texinfo help2man device-tree-compiler \
            libglib2.0-dev python3-pyelftools python3-dev

      - name: Validate build dependencies and shell scripts
        run: |
          /usr/bin/python3 -c 'from elftools.elf.elffile import ELFFile; print("pyelftools OK")'
          bash -n scripts/build.sh
          bash -n scripts/build/release-notes.sh scripts/build/bundle-openclash-core.sh
          python3 scripts/tests/test_merge_config.py
          python3 scripts/tests/test_cake_autorate.py
          bash scripts/verify-migration.sh

      - name: Clone upstream before restoring caches
        run: bash scripts/build.sh source

      - name: Restore source download cache
        id: download_cache
        uses: actions/cache/restore@v5
        with:
          path: workdir/istoreos/dl
          key: h6xk-dl-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            h6xk-dl-v1-${{ runner.os }}-

      - name: Restore compiler cache
        id: compiler_cache
        uses: actions/cache/restore@v5
        with:
          path: workdir/istoreos/.ccache
          key: h6xk-ccache-v1-${{ runner.os }}-${{ hashFiles('.config', 'h6xk-features.config') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            h6xk-ccache-v1-${{ runner.os }}-${{ hashFiles('.config', 'h6xk-features.config') }}-
            h6xk-ccache-v1-${{ runner.os }}-

      - name: Initialize CCache
        run: |
          mkdir -p "$CCACHE_DIR" workdir/istoreos/dl
          ccache --max-size 1536M
          ccache --zero-stats
          echo "Download cache hit: ${{ steps.download_cache.outputs.cache-hit }}"
          echo "Compiler cache hit: ${{ steps.compiler_cache.outputs.cache-hit }}"

      - name: Build firmware
        run: bash scripts/build.sh

      - name: Report CCache results
        if: always()
        run: ccache --show-stats || true

      - name: Save source download cache
        if: always() && steps.download_cache.outcome == 'success' && steps.download_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: workdir/istoreos/dl
          key: h6xk-dl-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save compiler cache
        if: always() && steps.compiler_cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: workdir/istoreos/.ccache
          key: h6xk-ccache-v1-${{ runner.os }}-${{ hashFiles('.config', 'h6xk-features.config') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-H6XK-firmware
          path: |
            output/*sysupgrade.img.gz
            output/SHA256SUMS
            output/BUILD-INFO.txt
            output/release-notes.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-H6XK-build-logs
          path: |
            output/build.log
            output/build-parallel.log
            output/download.log
            output/download-retry.log
            output/config.before-defconfig
            output/config.after-defconfig
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Publish pre-release
        if: ${{ inputs.publish_release == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="h6xk-$(date -u +'%Y%m%d-%H%M')-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" output/*sysupgrade.img.gz output/SHA256SUMS output/BUILD-INFO.txt output/release-notes.md \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "iStoreOS H6XK $tag" \
            --notes-file output/release-notes.md
