name: Build iStoreOS H6XK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "编译成功后发布到 Releases"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: h6xk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout configuration repository
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip wget zlib1g-dev file xz-utils subversion swig time \
            libelf-dev cmake ninja-build meson pkg-config jq curl perl \
            patch libfuse-dev autopoint texinfo help2man device-tree-compiler \
            libglib2.0-dev

      - name: Validate shell scripts
        run: bash -n scripts/build.sh

      - name: Build firmware
        run: bash scripts/build.sh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-H6XK-firmware
          path: output/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish release
        if: ${{ github.event_name == 'push' || inputs.publish_release == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="h6xk-$(date -u +'%Y%m%d-%H%M')-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" output/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "iStoreOS H6XK $tag" \
            --notes "iStoreOS 25.12 + LianXia233/QModem + RTL8852BE/RTL8922AE/MT7916/WCN6855。请核验 BUILD-INFO.txt 和 SHA256SUMS；刷机前备份原有固件。"
